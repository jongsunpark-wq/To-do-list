<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>기도편지</title>
  <meta name="description" content="기도편지를 나누는 블로그입니다." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-title" href="./">🙏 기도편지</a>
      <p class="site-subtitle">함께 기도하며 마음을 나누는 공간입니다</p>
    </div>
  </header>

  <main class="site-main">
    <section id="intro" class="intro-card">
      <p>
        이곳은 기도편지를 정리해서 나누는 블로그입니다. 지난 소식과 기도제목,
        감사제목을 이 곳에 모아둡니다. 아래 목록에서 글을 눌러 자세한 내용을
        읽어보실 수 있습니다.
      </p>
    </section>

    <section id="tag-filters" class="tag-filters" aria-label="태그 필터"></section>

    <section id="post-list" class="post-grid" aria-label="글 목록"></section>

    <section id="post-detail" class="post-detail hidden" aria-label="글 본문">
      <button id="back-btn" class="back-btn">← 목록으로</button>
      <article id="post-detail-content"></article>
    </section>
  </main>

  <div id="lightbox" class="lightbox hidden">
    <button id="lightbox-close" class="lightbox-close" aria-label="닫기">✕</button>
    <img id="lightbox-img" alt="" />
  </div>

  <footer class="site-footer">
    <p>기도해 주셔서 감사합니다. 🙏</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
