<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>To-Do List</h1>
      <p class="date" id="today"></p>
    </header>

    <form id="todo-form" class="todo-form">
      <input
        type="text"
        id="todo-input"
        placeholder="할 일을 입력하세요..."
        autocomplete="off"
        maxlength="200"
      />
      <button type="submit">추가</button>
    </form>

    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="all">전체</button>
      <button class="filter-btn" data-filter="active">진행중</button>
      <button class="filter-btn" data-filter="completed">완료</button>
    </div>

    <ul class="todo-list" id="todo-list"></ul>

    <footer class="app-footer">
      <span id="items-left">0개 남음</span>
      <button id="clear-completed">완료 항목 삭제</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
